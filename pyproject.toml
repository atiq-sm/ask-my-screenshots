[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-my-screenshots"
version = "0.1.0"
description = "Local-first semantic search over screenshots"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "atiq-sm" }
]
dependencies = []

[project.scripts]
screenshot-search = "ams.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
